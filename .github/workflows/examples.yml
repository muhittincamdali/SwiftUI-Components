# Repository-specific: builds the example app that the README samples are copied from.
name: Example app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ComponentGallery (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: xcodebuild -version

      - name: Build
        working-directory: Examples/ComponentGallery
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild build -project ComponentGallery.xcodeproj -scheme ComponentGallery \
            -destination "$DESTINATION" -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO -quiet
