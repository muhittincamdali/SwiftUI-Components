name: Feature request
description: Suggest a new component or an option for an existing one
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to build?
      description: Describe the screen or interaction you are trying to create.
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: How would you like to call it?
      render: swift

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
