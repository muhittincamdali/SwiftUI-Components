name: Bug report
description: A component renders or behaves incorrectly
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: e.g. CreditCardInput
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      render: swift

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS device
        - iOS simulator
        - macOS
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: OS and Xcode versions
      placeholder: e.g. iOS 26.5, Xcode 27.0
    validations:
      required: true
